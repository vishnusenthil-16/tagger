name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check src tests scripts/run_live_smoke.py
      - run: uv run ruff format --check src tests scripts/run_live_smoke.py
      - run: uv run pytest -q
      - run: uv build
